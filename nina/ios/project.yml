# FILE: ios/project.yml
#
# Descrizione del progetto Xcode per XcodeGen.
#
# Perché non un .xcodeproj committato: quel file è enorme, illeggibile e genera
# conflitti a ogni modifica fatta da due persone. Questo file dice le stesse
# cose in trenta righe leggibili, e il progetto si rigenera in un secondo:
#
#   brew install xcodegen        (una volta sola)
#   cd ios && xcodegen generate
#   open Nina.xcodeproj
#
# Prima di archiviare per l'App Store cambia DEVELOPMENT_TEAM e i bundle id
# con i tuoi: vedi docs/APP_STORE.md.

name: Nina
options:
  bundleIdPrefix: it.nina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # ← il tuo Team ID di Apple Developer
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Nina:
    type: application
    platform: iOS
    sources:
      - path: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app
        PRODUCT_NAME: Nina
        INFOPLIST_FILE: Nina/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone e iPad
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Nina/Nina.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: NinaWidgets
    info:
      path: Nina/Info.plist
      properties:
        CFBundleDisplayName: Nina
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: SfondoNina
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # In sviluppo il backend gira in HTTP su localhost. In produzione
          # l'indirizzo è HTTPS e questa eccezione non si applica.
          NSAllowsLocalNetworking: true
        # Nina non usa fotocamera, microfono, posizione o rubrica: nessuna
        # descrizione d'uso serve, e nessun permesso viene chiesto.

  NinaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NinaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.widgets
        PRODUCT_NAME: NinaWidgets
        INFOPLIST_FILE: NinaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: NinaWidgets/NinaWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: NinaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nina
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NinaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NinaTests
    dependencies:
      - target: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.tests
        GENERATE_INFOPLIST_FILE: YES

  NinaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NinaUITests
    dependencies:
      - target: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nina:
    build:
      targets:
        Nina: all
        NinaWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NinaTests
        - NinaUITests
    archive:
      config: Release
