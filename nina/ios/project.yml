# FILE: ios/project.yml
#
# Descrizione del progetto Xcode per XcodeGen.
#
# Perché non un .xcodeproj committato: quel file è enorme, illeggibile e genera
# conflitti a ogni modifica fatta da due persone. Questo file dice le stesse
# cose in trenta righe leggibili, e il progetto si rigenera in un secondo:
#
#   brew install xcodegen        (una volta sola)
#   cd ios && xcodegen generate
#   open Nina.xcodeproj
#
# Prima di archiviare per l'App Store cambia DEVELOPMENT_TEAM e i bundle id
# con i tuoi: vedi docs/APP_STORE.md.

name: Nina
options:
  bundleIdPrefix: it.nina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Nessun DEVELOPMENT_TEAM qui di proposito.
    #
    # Per il simulatore non serve firmare niente: l'app si costruisce e gira
    # senza alcun account Apple. Lasciare il campo presente ma vuoto è la cosa
    # peggiore delle due, perché Xcode a volte lo interpreta come «team scelto
    # e non valido» e mostra un errore di firma che non c'entra niente.
    #
    # Per installarla su un iPhone vero il team si sceglie dall'interfaccia di
    # Xcode (Signing & Capabilities), e da lì viene scritto nelle impostazioni
    # locali senza toccare questo file.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

    # `targeted` e non `complete`.
    #
    # Con `complete` ogni singolo `#Predicate` di SwiftData produce una
    # manciata di avvisi su KeyPath che non è Sendable. Non riguardano il
    # nostro codice: nascono dentro l'espansione di una macro di Apple, e da
    # qui non c'è niente da correggere. Il risultato erano centinaia di righe
    # di rumore in cui il primo errore vero — un ordinamento su un Bool — si
    # perdeva.
    #
    # `targeted` continua a controllare la concorrenza nel codice che
    # scriviamo noi. È l'impostazione che rende visibili gli errori invece di
    # seppellirli.
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Nina:
    type: application
    platform: iOS
    sources:
      - path: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app
        PRODUCT_NAME: Nina
        INFOPLIST_FILE: Nina/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone e iPad
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Nina/Nina.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: NinaWidgets
    info:
      path: Nina/Info.plist
      properties:
        CFBundleDisplayName: Nina
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: SfondoNina
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        # Schema usato dai widget per aprire la schermata giusta.
        CFBundleURLTypes:
          - CFBundleURLName: it.nina.app
            CFBundleURLSchemes:
              - nina
        NSAppTransportSecurity:
          # In sviluppo il backend gira in HTTP su localhost. In produzione
          # l'indirizzo è HTTPS e questa eccezione non si applica.
          NSAllowsLocalNetworking: true
        # Nina non usa fotocamera, microfono, posizione o rubrica: nessuna
        # descrizione d'uso serve, e nessun permesso viene chiesto.

  NinaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NinaWidgets

      # Un'estensione è un binario a sé: non vede il codice dell'app, va
      # compilata anche lei. Questi sono i file che le servono davvero, e
      # nient'altro — l'elenco è la chiusura delle dipendenze a partire da
      # ciò che NinaWidgets.swift usa.
      #
      # Attenzione: `Deposito` compare qui perché lo cita `SpuntaAttivita`,
      # l'intent del bottone. Compilarlo nell'estensione NON significa che il
      # widget apra il database: quel codice nell'estensione non viene mai
      # eseguito, perché gli App Intent dei widget girano nel processo
      # dell'app. Il widget legge solo la fotografia in `DatiCondivisi`.
      - path: Nina/Models/Dominio.swift
      - path: Nina/Models/ModelliLocali.swift
      - path: Nina/Persistence/Deposito.swift
      - path: Nina/Core/CalendarioNina.swift
      - path: Nina/Core/VoceDiNina.swift
      - path: Nina/Core/DatiCondivisi.swift
      - path: Nina/Intents/IntentiNina.swift
      - path: Nina/DesignSystem/Palette.swift
      - path: Nina/DesignSystem/Spazi.swift
      - path: Nina/DesignSystem/Tipografia.swift
      - path: Nina/DesignSystem/Componenti.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.widgets
        PRODUCT_NAME: NinaWidgets
        INFOPLIST_FILE: NinaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: NinaWidgets/NinaWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: NinaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nina
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NinaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NinaTests
    dependencies:
      - target: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.tests
        GENERATE_INFOPLIST_FILE: YES

  NinaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NinaUITests
    dependencies:
      - target: Nina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.nina.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nina:
    build:
      targets:
        Nina: all
        NinaWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NinaTests
        - NinaUITests
    archive:
      config: Release
